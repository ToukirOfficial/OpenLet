name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openlet
          POSTGRES_PASSWORD: openlet
          POSTGRES_DB: openlet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openlet" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openlet:openlet@127.0.0.1:5432/openlet_test
      TEST_DATABASE_URL: postgresql://openlet:openlet@127.0.0.1:5432/openlet_test
      REDIS_URL: redis://127.0.0.1:6379/14
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: ./scripts/scan-secrets.sh --all
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  # Builds both images and starts the full stack the way a self-hoster would.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with fresh secrets
        run: ./scripts/init-env.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Web and API answer through the web server
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8030/api/v1/health && break
            sleep 5
          done
          curl -fsS http://localhost:8030/api/v1/health
          curl -fsS http://localhost:8030/api/v1/setup
          curl -fsS -o /dev/null http://localhost:8030/
          curl -fsS -o /dev/null http://localhost:8030/login
          test "$(docker compose ps --format '{{.Service}} {{.Health}}' | grep '^api ' | cut -d' ' -f2)" = "healthy"
          docker compose ps --format '{{.Service}} {{.State}}' | grep -q '^worker running'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
